<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc"><title id="title">Fraction bar</title><desc id="desc">One whole bar is divided into eight equal sections. Five sections have both shading and diagonal stripes. The other sections are unshaded.</desc><rect width="640" height="300" fill="#fff"/><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="#fff" stroke-width="2"/></pattern></defs><rect data-cell="0" x="48" y="104" width="68" height="100" fill="#5940b1"/><rect data-shaded="0" x="48" y="104" width="68" height="100" fill="url(#hatch)"/><rect data-cell="1" x="116" y="104" width="68" height="100" fill="#5940b1"/><rect data-shaded="1" x="116" y="104" width="68" height="100" fill="url(#hatch)"/><rect data-cell="2" x="184" y="104" width="68" height="100" fill="#5940b1"/><rect data-shaded="2" x="184" y="104" width="68" height="100" fill="url(#hatch)"/><rect data-cell="3" x="252" y="104" width="68" height="100" fill="#5940b1"/><rect data-shaded="3" x="252" y="104" width="68" height="100" fill="url(#hatch)"/><rect data-cell="4" x="320" y="104" width="68" height="100" fill="#5940b1"/><rect data-shaded="4" x="320" y="104" width="68" height="100" fill="url(#hatch)"/><rect data-cell="5" x="388" y="104" width="68" height="100" fill="#ffffff"/><rect data-cell="6" x="456" y="104" width="68" height="100" fill="#ffffff"/><rect data-cell="7" x="524" y="104" width="68" height="100" fill="#ffffff"/><rect x="48" y="104" width="544" height="100" fill="none" stroke="#17204b" stroke-width="3"/><line x1="116" y1="104" x2="116" y2="204" stroke="#17204b" stroke-width="2"/><line x1="184" y1="104" x2="184" y2="204" stroke="#17204b" stroke-width="2"/><line x1="252" y1="104" x2="252" y2="204" stroke="#17204b" stroke-width="2"/><line x1="320" y1="104" x2="320" y2="204" stroke="#17204b" stroke-width="2"/><line x1="388" y1="104" x2="388" y2="204" stroke="#17204b" stroke-width="2"/><line x1="456" y1="104" x2="456" y2="204" stroke="#17204b" stroke-width="2"/><line x1="524" y1="104" x2="524" y2="204" stroke="#17204b" stroke-width="2"/></svg>