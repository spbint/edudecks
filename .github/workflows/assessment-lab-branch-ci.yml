name: Assessment Lab Branch CI

on:
  push:
    branches:
      - feat/assessment-anchor-routing-lab

jobs:
  validate-assessment-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck application
        run: npm run typecheck

      # Repository-wide test typecheck currently has unrelated legacy failures on main.
      # Focused Vitest below compiles the assessment files changed by this branch.
      - name: Run focused assessment tests
        run: >
          npx vitest run
          app/components/clean/assessment-lab/AssessmentPlayerV1.test.ts
          app/components/clean/assessment-lab/AssessmentAnchorPlacementRunner.test.tsx
          app/components/clean/assessment-lab/AssessmentPlacementResultCard.test.tsx
          app/components/clean/assessment-lab/AssessmentItemReviewLab.test.tsx
          app/components/clean/assessment-lab/AssessmentNumberOperationsProfileCard.test.tsx
          app/components/clean/assessment-lab/AssessmentNumberOperationsBaselineRunner.test.tsx
          lib/clean/assessments/mylearnaAssessScoring.test.ts
          lib/clean/assessments/placement/numberOperationsAnchors.test.ts
          lib/clean/assessments/placement/numberOperationsP0Audit.test.ts
          lib/clean/assessments/placement/numberOperationsP0Items.test.ts
          lib/clean/assessments/placement/numberOperationsItemRegistry.test.ts
          lib/clean/assessments/placement/numberOperationsPlacementResult.test.ts
          lib/clean/assessments/placement/numberOperationsProfile.test.ts
          lib/clean/assessments/placement/numberOperationsRecommendations.test.ts
          lib/clean/assessments/placement/numberOperationsEvidencePreview.test.ts
          lib/clean/assessments/placement/numberOperationsBaselineSnapshot.test.ts
          lib/clean/assessments/placement/numberOperationsAttemptTrace.test.ts
          lib/clean/assessments/placement/numberOperationsPersistenceDraft.test.ts
          lib/clean/assessments/placement/numberOperationsRoutingFixtures.test.ts
          lib/clean/assessments/visualTemplates/CurrencyTokenVisual.test.tsx


      - name: Build application
        run: npm run build
